name: run-oda-bid-bot

on:
  schedule:
    - cron: "30 23 * * *"  # 매일 08:30 KST, DeepSeek 오프피크
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Bid Bot (본공고 수집)
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main.py

      - name: Run Pre-Bid Bot (사전공고 수집)
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main_pre.py

      - name: Run Order Plan Bot (발주계획 수집)
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main_order_plan.py
