name: run-oda-bid-bot

on:
  schedule:
    - cron: "30 23 * * *"  # 매일 08:30 KST, DeepSeek 오프피크
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Bid Bot (본공고 수집)
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          DISCORD_WEBHOOK_URL_BID: ${{ secrets.DISCORD_WEBHOOK_URL_BID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main.py

      - name: Run Pre-Bid Bot (사전공고 수집)
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          DISCORD_WEBHOOK_URL_PREBID: ${{ secrets.DISCORD_WEBHOOK_URL_PREBID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main_pre.py

      - name: Run Order Plan Bot (발주계획 수집)
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          DISCORD_WEBHOOK_URL_ORDER_PLAN: ${{ secrets.DISCORD_WEBHOOK_URL_ORDER_PLAN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main_order_plan.py

      - name: Save bid history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bid_history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update bid history [skip ci]"
          git push origin main
